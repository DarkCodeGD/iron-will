<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Iron Will · render mode "Wave": one smooth line through every band,
       with a soft glow filling the area beneath it. -->
  <defs>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="4" y1="0" x2="60" y2="0">
      <stop offset="0" stop-color="#FFC85A"/>
      <stop offset="0.5" stop-color="#FF8A1F"/>
      <stop offset="1" stop-color="#E8262E"/>
    </linearGradient>
    <linearGradient id="fill" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="0" y2="58">
      <stop offset="0" stop-color="#FF8A1F" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#E8262E" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path d="M4 40 C10 40 12 18 20 18 S28 46 36 44 S48 12 60 22 L60 58 L4 58 Z" fill="url(#fill)"/>
  <path d="M4 40 C10 40 12 18 20 18 S28 46 36 44 S48 12 60 22" fill="none"
        stroke="url(#line)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="20" cy="18" r="3" fill="#FFF1CC"/>
</svg>
