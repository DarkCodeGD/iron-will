<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Iron Will · render mode "Bubbles": one big soap bubble and two small
       ones drifting up. Clear in the middle, a warm film around the rim (the
       soap-film sheen, in the Ascend palette with a touch of pink), the
       cartoon window shine up top-left, and a twinkle from a bubble that
       just popped. -->
  <defs>
    <linearGradient id="film" gradientUnits="userSpaceOnUse" x1="8" y1="20" x2="44" y2="58">
      <stop offset="0" stop-color="#FFC85A"/>
      <stop offset="0.35" stop-color="#FF8A1F"/>
      <stop offset="0.7" stop-color="#E8262E"/>
      <stop offset="1" stop-color="#FF6FAE"/>
    </linearGradient>
    <linearGradient id="film2" gradientUnits="userSpaceOnUse" x1="40" y1="6" x2="58" y2="26">
      <stop offset="0" stop-color="#FF6FAE"/>
      <stop offset="0.5" stop-color="#FF9A1F"/>
      <stop offset="1" stop-color="#FFC85A"/>
    </linearGradient>
    <!-- the film's color wash fades in toward the rim, like the real thing -->
    <radialGradient id="body" gradientUnits="userSpaceOnUse" cx="26" cy="39" r="17">
      <stop offset="0.55" stop-color="#FF8A1F" stop-opacity="0"/>
      <stop offset="0.9" stop-color="#FF6A3A" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#E8262E" stop-opacity="0.45"/>
    </radialGradient>
    <radialGradient id="body2" gradientUnits="userSpaceOnUse" cx="49" cy="16" r="8">
      <stop offset="0.5" stop-color="#FF9A1F" stop-opacity="0"/>
      <stop offset="1" stop-color="#FF6FAE" stop-opacity="0.4"/>
    </radialGradient>
  </defs>

  <!-- big bubble -->
  <circle cx="26" cy="39" r="17" fill="url(#body)"/>
  <circle cx="26" cy="39" r="16" fill="none" stroke="url(#film)" stroke-width="2.6"/>
  <ellipse cx="18.5" cy="31" rx="5.2" ry="2.6" transform="rotate(-40 18.5 31)" fill="#FFFFFF"/>
  <circle cx="26" cy="27.4" r="1.5" fill="#FFFFFF"/>
  <path d="M37.5 46 A13 13 0 0 1 31 51.3" fill="none" stroke="#FFFFFF" stroke-width="1.6"
        stroke-linecap="round" opacity="0.7"/>

  <!-- small bubble -->
  <circle cx="49" cy="16" r="8" fill="url(#body2)"/>
  <circle cx="49" cy="16" r="7.4" fill="none" stroke="url(#film2)" stroke-width="2"/>
  <ellipse cx="45.6" cy="12.6" rx="2.4" ry="1.2" transform="rotate(-40 45.6 12.6)" fill="#FFFFFF"/>

  <!-- tiny bubble -->
  <circle cx="51" cy="40" r="3.6" fill="none" stroke="#FF8A1F" stroke-width="1.6"/>
  <circle cx="49.8" cy="38.8" r="0.9" fill="#FFFFFF"/>

  <!-- a twinkle where one just popped -->
  <path d="M12 6 Q12.6 10.4 17 11 Q12.6 11.6 12 16 Q11.4 11.6 7 11 Q11.4 10.4 12 6 Z" fill="#FFC85A"/>
  <circle cx="33" cy="9" r="1.3" fill="#FF6FAE"/>
</svg>
