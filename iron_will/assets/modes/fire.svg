<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Iron Will · render mode "Fire": a flame with a white-hot core, two
       side tongues and rising embers. Hot at the base, crimson at the tips. -->
  <defs>
    <linearGradient id="outer" gradientUnits="userSpaceOnUse" x1="0" y1="60" x2="0" y2="4">
      <stop offset="0" stop-color="#FF9A1F"/>
      <stop offset="0.6" stop-color="#FF5A16"/>
      <stop offset="1" stop-color="#D81E2A"/>
    </linearGradient>
    <linearGradient id="side" gradientUnits="userSpaceOnUse" x1="0" y1="60" x2="0" y2="34">
      <stop offset="0" stop-color="#FF8A1F"/>
      <stop offset="1" stop-color="#D81E2A"/>
    </linearGradient>
    <linearGradient id="core" gradientUnits="userSpaceOnUse" x1="0" y1="58" x2="0" y2="26">
      <stop offset="0" stop-color="#FFF6DC"/>
      <stop offset="0.5" stop-color="#FFD66B"/>
      <stop offset="1" stop-color="#FFA92E"/>
    </linearGradient>
  </defs>
  <!-- side tongues -->
  <path d="M17 59 C9 56 7 47 10 38 C12 45 15 48 19 50 Z" fill="url(#side)"/>
  <path d="M47 59 C55 56 57 47 54 38 C52 45 49 48 45 50 Z" fill="url(#side)"/>
  <!-- main flame -->
  <path d="M32 3 C35 13 48 21 48 38 C48 51 41 59 32 59 C23 59 16 51 16 38
           C16 30 19 24 24 19 C23 27 26 32 30 33 C27 23 29 12 32 3 Z" fill="url(#outer)"/>
  <!-- white-hot core -->
  <path d="M32 26 C35 33 41 38 41 46 C41 53 37 57 32 57 C27 57 23 53 23 46
           C23 40 29 35 32 26 Z" fill="url(#core)"/>
  <!-- embers -->
  <circle cx="50" cy="13" r="2" fill="#FFC85A"/>
  <circle cx="44" cy="5.5" r="1.3" fill="#FFB347"/>
  <circle cx="13" cy="20" r="1.6" fill="#FFC85A"/>
</svg>
