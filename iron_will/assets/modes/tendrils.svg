  <!-- Iron Will · render mode "Void Tendrils": four shadow tendrils rising
       from a dark root mass, black bodies edged in a violet sheath (the same
       look as the shader's rim), the tall one hooked over at the tip, with
       motes of void essence drifting off. Outlines are offsets of a curved
       spine, generated rather than drawn by hand. -->
