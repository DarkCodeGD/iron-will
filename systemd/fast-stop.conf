# Iron Will · fast, guaranteed stop (installed as <unit>.d/90-fast-stop.conf
# for every Iron Will service).
#
# Shutdown, reboot and logout must never wait on Iron Will, playing or not.
# On stop, SIGTERM goes to every process in the unit at once (the app plus any
# cava / pw-play child). Whatever is still alive 3 s later gets SIGKILL, which
# can't be caught or ignored. A normal stop takes ~30 ms; the cap only matters
# if something ever hangs (a GPU driver stall, a stuck D-Bus call...).
#
# Why a drop-in and not plain unit settings: Fedora ships
# /usr/lib/systemd/user/service.d/10-timeout-abort.conf, which sets
# TimeoutStopFailureMode=abort for *every* user service. Drop-ins beat the
# unit file, so a hung service would get SIGABRT, dump core, and then wait
# another TimeoutAbortSec (45 s) before the SIGKILL. Drop-ins apply in file
# name order across directories, so "90-" lands after Fedora's "10-" and wins,
# for Iron Will's units only.

[Service]
KillMode=control-group
TimeoutStopSec=3s
TimeoutStopFailureMode=kill
TimeoutAbortSec=3s
SendSIGKILL=yes
