# Iron Will — desktop audio toolkit configuration
# Edit by hand or with `iron-will-settings`. Changes apply live.
# Invalid values fall back to their defaults; unknown keys are ignored.

# ── Visualizer · look ───────────────────────────────────────────
[visualizer]
# Render style — bars | mirror | wave | fire | ferro | bubbles
mode = "bars"
# Number of bars / wave points — 8 … 256
bar_count = 64
# Gap between bars in pixels — 0 … 32
spacing = 4
# Bar corner rounding: 0 = square, 1 = fully pill-shaped — 0 … 1
roundness = 1.0
# Resting bar height in pixels while audio is playing — 0 … 20
min_height = 2
# Overall opacity — 0.05 … 1
opacity = 0.9
# Colors: follow the Plasma accent color, or use the custom list — accent | custom
color_source = "accent"
# Custom gradient stops (1 = solid color, up to 6)
colors = ["#2EC4B6", "#3A86FF", "#8338EC"]
# Gradient axis — horizontal | vertical
gradient_direction = "vertical"
# Draw falling peak caps above bars
peaks = true
# Frames per second (also cava's analysis rate) — 24 … 165
fps = 60

# ── Visualizer · motion & physics ───────────────────────────────
[motion]
# Rise time constant in ms (lower = punchier) — 0 … 500
attack_ms = 35
# Fall time constant in ms (higher = smoother) — 10 … 2000
decay_ms = 220
# How long a peak cap hangs before falling — 0 … 3000
peak_hold_ms = 400
# Peak cap fall acceleration (bar-heights per second²) — 0.1 … 20
peak_gravity = 2.5
# Fade the visualizer out when audio goes silent
idle_fade = true
# Seconds of silence before fading out — 0.5 … 60
idle_timeout = 4.0

# ── Visualizer · fire mode ──────────────────────────────────────
[fire]
# How tall the flames reach at full blast (share of the visualizer's height) — 0.1 … 1
height = 0.9
# How hard the music drives the fire — 0.3 … 2
intensity = 1.0
# Spark amount: embers thrown up by snare and cymbal hits (0 = none) — 0 … 1
sparks = 0.6
# Flame speed: how fast the flames churn (the music speeds them up further) — 0.3 … 2.5
speed = 1.0
# Glow: firelight thrown onto the wallpaper around the flames, and core bloom (0 = none) — 0 … 1
glow = 0.6
# How fast the fire catches and dies down: 0 = slow, heavy burn, 1 = snappy flare-ups — 0 … 1
reaction = 0.5
# How see-through the flames are: 0 = solid, 1 = ghostly (hot cores stay bright) — 0 … 1
translucency = 0.6
# Flame colors: your gradient colors, or natural fire — colors | natural
palette = "colors"

# ── Visualizer · ferrofluid mode ────────────────────────────────
[ferro]
# How tall the spikes reach at full blast (share of the visualizer's height) — 0.1 … 1
height = 0.85
# How hard the music pulls on the liquid — 0.3 … 2
intensity = 1.0
# Spike shape: 0 = soft rounded cones, 1 = needle-sharp — 0 … 1
sharpness = 0.6
# How many spikes stand along the width: 0 = a few big ones, 1 = a dense forest — 0 … 1
density = 0.5
# Liquid jiggle after each hit: 0 = stiff, 1 = very wobbly — 0 … 1
wobble = 0.6
# How fast the spikes rise and fall: 0 = slow and heavy, 1 = snappy — 0 … 1
reaction = 0.5
# Colored rim light and backlight; keeps the black liquid visible on dark wallpapers — 0 … 1
rim = 0.7
# Strength of the studio-light reflections on the liquid — 0 … 1
gloss = 0.8
# Rim light colors: your gradient colors, or neutral chrome — colors | chrome
palette = "colors"

# ── Visualizer · bubbles mode ───────────────────────────────────
[bubbles]
# How many bubbles float at once, and how fast new ones are blown — 0 … 1
amount = 0.6
# Bubble size: 0 = tiny, 1 = big and round — 0 … 1
size = 0.5
# How fast the bubbles rise (the music speeds them up further) — 0.3 … 2.5
float_speed = 1.0
# How much the bubbles squish and jiggle on each kick: 0 = firm, 1 = jelly — 0 … 1
wobble = 0.6
# How eagerly snare and cymbal hits pop bubbles (0 = they only pop at the top) — 0 … 1
pops = 0.6
# Rainbow soap-film shimmer on each bubble (0 = clear glass) — 0 … 1
sheen = 0.8
# Tiny background bubbles that fizz up with the cymbals (0 = none) — 0 … 1
fizz = 0.5
# Bubble colors: rainbow soap film, soft pastels, or your gradient colors — iridescent | pastel | colors
palette = "iridescent"
# What a popping bubble leaves behind: little sparkles or hearts — sparkles | hearts
pop_shape = "sparkles"

# ── Visualizer · placement on screen ────────────────────────────
[layout]
# Screen edge to attach to — bottom | top
anchor = "bottom"
# Which way bars and flames grow — up | down
direction = "up"
# Horizontal alignment — left | center | right | stretch
align = "center"
# Width in logical pixels (ignored when align = stretch) — 50 … 7680
width = 960
# Height in logical pixels — 16 … 2160
height = 90
# Span the whole screen height (minus panels and margin_y), ignoring height. Gives fire mode headroom so tall flames, glow and embers never hit the window's edge
full_height = false
# Horizontal offset: from the aligned edge, or shift when centered — -4000 … 4000
margin_x = 0
# Distance from the anchored edge (or from the panel, see respect_panels) — 0 … 4000
margin_y = 0
# Stacking layer: bottom = above wallpaper, below windows — background | bottom | top
layer = "bottom"
# Sit above panels instead of behind them (Wayland: exclusive zones)
respect_panels = true

# ── Visualizer · audio analysis (cava) ──────────────────────────
[analysis]
# Audio capture backend; auto tries PipeWire, then PulseAudio (works via pipewire-pulse) — auto | pipewire | pulse
input = "auto"
# Sensitivity in percent — 10 … 500
sensitivity = 100
# Let cava auto-adjust sensitivity to the volume
autosens = true
# Lowest analysed frequency in Hz — 20 … 1000
low_cutoff = 50
# Highest analysed frequency in Hz — 2000 … 20000
high_cutoff = 12000
# cava's own smoothing, 0–100 (our physics does the rest) — 0 … 100
noise_reduction = 20

# ── Session sounds ──────────────────────────────────────────────
[sounds]
# Folder with .mp3 .wav .ogg .flac .opus files (searched recursively)
directory = "~/Music/login_sounds"
# Play when the session starts
on_login = true
# Play after waking from suspend
on_resume = true
# Play after unlocking the screen
on_unlock = true
# Seconds to wait after login — 0 … 30
login_delay = 3.0
# Seconds to wait after resume (audio devices re-initialising) — 0 … 30
resume_delay = 2.5
# Seconds to wait after unlock — 0 … 30
unlock_delay = 0.5
# Minimum seconds between two sounds (stops resume + unlock double-plays) — 0 … 600
cooldown = 30
# Playback volume — 0 … 1
volume = 0.8
# Audio player to use — auto | pw-play | paplay | ffplay | mpv
backend = "auto"
# Never play the same track twice in a row
avoid_repeat = true
# Show a notification with a Stop button while a session sound plays
notify = true
